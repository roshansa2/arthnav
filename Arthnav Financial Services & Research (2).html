<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arthnav Financial Services & Research | SEBI Registered Research Analyst</title>
<meta name="description" content="Professional financial education and research academy: technical analysis, trading strategies, risk management and disciplined trading.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{--bg:#fff;--surf:#f3f7fd;--card:#fff;--ink:#0b1633;--mut:#4f5f86;--line:#dde5f3;--g:#0c9f58;--r:#e5384a;--navy:#0B1F4B;--hd:#ffffffdb;--ha:#dbe8ff;--hb:#d9f7e8;--sh:0 14px 34px -20px #0B1F4B55;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050c1d;--surf:#0a1530;--card:#0e1b3b;--ink:#eef3ff;--mut:#9db0d3;--line:#1b2c55;--g:#19d37a;--r:#ff4d5e;--hd:#050c1dcc;--ha:#16336f;--hb:#0b3a2c;--sh:0 14px 34px -20px #000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#050c1d;--surf:#0a1530;--card:#0e1b3b;--ink:#eef3ff;--mut:#9db0d3;--line:#1b2c55;--g:#19d37a;--r:#ff4d5e;--hd:#050c1dcc;--ha:#16336f;--hb:#0b3a2c;--sh:0 14px 34px -20px #000;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font:16px/1.65 Inter,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:72px;overflow-x:hidden}
h1,h2,h3{line-height:1.12;margin:0 0 .5em;letter-spacing:-.02em;font-weight:800}a{color:inherit}.w{max-width:1160px;margin:auto;padding:0 22px}.sec{padding:84px 0;position:relative}
.sub{color:var(--mut);max-width:620px}.eyb{font:600 12px 'IBM Plex Mono',monospace;color:var(--g);letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
.strip{background:#0B1F4B;color:#dbe6ff;font-size:12.5px;text-align:center;padding:7px 12px}.strip b{color:#5cf0a4;font-family:'IBM Plex Mono',monospace}
#pg{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--g),#5ab0ff,var(--r));transform-origin:0 50%;z-index:60}
header{position:sticky;top:0;z-index:40;background:var(--hd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:18px;height:68px}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;font-weight:800;line-height:1.05}.brand img{width:42px;height:42px;border-radius:50%;box-shadow:0 0 0 2px var(--g)}.brand small{display:block;color:var(--mut);font-weight:500;font-size:11px;margin-top:2px}
nav{margin-left:auto;display:flex;gap:6px;align-items:center}nav a.l{text-decoration:none;font-weight:600;font-size:15px;padding:8px 14px;border-radius:99px;color:var(--mut);cursor:pointer;transition:.2s}nav a.l:hover,nav a.on{color:var(--ink);background:var(--surf)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:12px;padding:14px 24px;font:700 15px Inter,sans-serif;text-decoration:none;cursor:pointer}
.g{background:linear-gradient(135deg,#19d37a,#0fae62);color:#04210f;box-shadow:0 10px 30px -8px #19d37a88}.o{border:1.5px solid var(--ink);color:var(--ink);background:transparent}.nv{background:var(--navy);color:#fff}.wa{background:#25D366;color:#053d1d}.ol{border:1.5px solid var(--line);color:var(--ink);background:var(--surf)}
.burger{display:none;margin-left:auto;background:var(--surf);border:1px solid var(--line);color:var(--ink);border-radius:10px;width:44px;height:44px;align-items:center;justify-content:center}
.pnl{position:fixed;inset:0 0 0 auto;width:84%;max-width:360px;background:var(--card);z-index:70;padding:24px;display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--line)}.pnl a.l{font-size:22px;font-weight:700;padding:12px 0;text-decoration:none;border-bottom:1px solid var(--line)}
.ov{position:fixed;inset:0;background:#000a;z-index:65}.cmp{margin-top:auto;border:1.5px dashed var(--r);border-radius:12px;padding:12px;font-size:13px;color:var(--mut)}
.hero{background:radial-gradient(900px 480px at 82% 8%,var(--ha) 0,transparent 62%),radial-gradient(640px 420px at 0% 95%,var(--hb) 0,transparent 62%),var(--bg);color:var(--ink);padding:70px 0 0;position:relative;overflow:hidden}
.hero .w{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;position:relative;z-index:2}
.hero h1{font-size:clamp(34px,5.2vw,64px);margin-bottom:22px}.hw{display:inline-block;overflow:visible}.hl{overflow:hidden;display:inline-block;padding-bottom:.08em}.hero p{color:var(--mut);font-size:18px;max-width:520px}
.gt{background:linear-gradient(90deg,#0a9a55,#19d37a);-webkit-background-clip:text;background-clip:text;color:transparent}.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.gr{position:relative}.gr svg{width:100%;height:auto;display:block}.bdg{position:absolute;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);padding:10px 14px;border-radius:14px;font-size:13px;font-weight:600;color:var(--ink);box-shadow:var(--sh)}
.bdg i{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:#19d37a22;color:#19d37a}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.22;pointer-events:none}
.mq{overflow:hidden;margin-top:54px;padding:16px 0;background:var(--navy);position:relative;z-index:2}.mq-in{display:flex;width:max-content;gap:0}.mq span{font:600 13px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#8fa6d6;padding:0 26px;white-space:nowrap}.mq span:nth-child(odd){color:#19d37a}
.grid{display:grid;gap:22px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);box-shadow:var(--sh);border:1px solid var(--line);border-radius:20px;padding:26px;position:relative;overflow:hidden}
.ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#19d37a28,#5ab0ff22);color:var(--g);margin-bottom:16px;border:1px solid #19d37a40}
.art{border-radius:14px;overflow:hidden;margin:-8px -8px 16px;background:linear-gradient(160deg,#0f2552,#08142f);border:1px solid var(--line)}.art svg{display:block;width:100%;height:auto}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 16px}.meta span{font:600 11.5px 'IBM Plex Mono',monospace;background:var(--bg);border:1px solid var(--line);padding:3px 10px;border-radius:99px;color:var(--mut)}
.sw{display:grid;grid-auto-flow:column;grid-auto-columns:31.5%;gap:22px}
.pill{padding:9px 18px;border-radius:99px;border:1px solid var(--line);background:var(--surf);color:var(--mut);font:600 14px Inter;cursor:pointer;white-space:nowrap}.pill.on{background:var(--navy);color:#fff;border-color:var(--g)}.fl{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin:22px 0 28px}
.steps{position:relative;padding-left:56px}.tl{position:absolute;left:21px;top:8px;bottom:8px;width:3px;background:var(--line);border-radius:3px}.tl-f{position:absolute;inset:0;background:linear-gradient(var(--g),#5ab0ff);border-radius:3px;transform-origin:top}
.st{position:relative;margin-bottom:22px}.st b{position:absolute;left:-56px;top:20px;width:44px;height:44px;border-radius:50%;background:var(--bg);border:2px solid var(--g);display:grid;place-items:center;font:600 15px 'IBM Plex Mono',monospace;color:var(--g)}
.acc{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--card);overflow:hidden}.acc button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;padding:17px 20px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:12px}.acc p{margin:0;padding:0 20px 18px;color:var(--mut)}
input{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:12px;font:16px Inter;margin-bottom:12px;background:var(--bg);color:var(--ink)}input:focus{outline:2px solid var(--g);outline-offset:1px}
.cta{background:linear-gradient(135deg,#0B1F4B,#143a86);border-radius:28px;padding:48px;color:#fff;position:relative;overflow:hidden;border:1px solid #ffffff22}.cta p{color:#c4d3f2}.cta input{border:0;background:#fff;color:#0b1633}
.risk{border:1.5px dashed var(--r);border-radius:14px;padding:15px 18px;font-size:14px;color:var(--mut);margin:24px 0}.risk b{color:var(--r)}
.pd{display:grid;grid-template-columns:1fr 340px;gap:36px;align-items:start}.enrol{position:sticky;top:90px}.crumb{font-size:13px;color:var(--mut);padding:22px 0 8px}.crumb a{color:var(--g);text-decoration:none;cursor:pointer}
footer{background:#040a18;color:#a9b9dc;padding:56px 0 24px;font-size:14px;border-top:1px solid #16284f}footer h4{color:#fff;margin:0 0 12px}footer a{display:block;text-decoration:none;padding:4px 0;cursor:pointer}footer a:hover{color:#5cf0a4}
.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.4fr;gap:30px}.fb{border-top:1px solid #ffffff1a;margin-top:30px;padding-top:18px;font-size:12.5px;color:#8398c3}.fb b{color:#ff8a96}
.bar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--hd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}.bar .btn{flex:1;padding:13px 8px}
.wf{position:fixed;right:22px;bottom:22px;z-index:50;width:58px;height:58px;border-radius:50%;background:#25D366;color:#053d1d;display:grid;place-items:center;box-shadow:0 12px 30px -6px #25D366aa}
.leg h1{font-size:38px}.leg p{color:var(--mut)}
@media(max-width:1023px){.sw{grid-auto-columns:46%}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.pd{grid-template-columns:1fr}.enrol{position:static}.fg{grid-template-columns:1fr 1fr}.hero .w{grid-template-columns:1fr}.hero{padding-top:44px}}
@media(max-width:767px){nav,.hd>.dk{display:none}.burger{display:flex}.sec{padding:56px 0}.bar{display:flex}.wf{display:none}body{padding-bottom:84px}
.sw{grid-auto-columns:82%;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}.sw>*{scroll-snap-align:start}.g3{grid-template-columns:1fr}.row .btn{width:100%}.fg{grid-template-columns:1fr}.cta{padding:28px 22px}.brand small{display:none}.bdg{transform:scale(.85)}.pd .enrol{display:none}}
